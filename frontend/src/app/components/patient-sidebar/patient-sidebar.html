
<aside class="sidebar">

  <div class="sidebar-header">

    <div class="logo-box">

      <div class="logo-icon">
        <i class="bi bi-activity"></i>
      </div>

      <div class="logo-text">
        <h2>PhysioProgress</h2>
        <span class="sub-status">● RECOVERY ENGINE</span>
      </div>

    </div>

    <div class="portal-badge">
      <span>● PATIENT PORTAL</span>
    </div>

    <div class="px-3 mt-2">

      <span
        class="font-mono small text-uppercase text-muted d-block mb-2 px-2"
        style="letter-spacing: 0.08em"
      >
        My Care
      </span>

      <nav class="nav flex-column gap-1" role="navigation">

        @for (item of navItems; track item.path) {

          <a
            [routerLink]="['/', 'patient', item.path]"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link-custom d-flex align-items-center gap-2 px-2 py-2 rounded"
          >

            <i
              class="bi"
              [class]="item.icon"
              aria-hidden="true"
            ></i>

            <span>{{ item.label }}</span>

          </a>

        }

      </nav>

    </div>

  </div>


  <div class="sidebar-footer">

    <div class="user-card">

      <div class="avatar-container">

        <div class="avatar">
          R2
        </div>

        <span class="status-dot"></span>

      </div>


      <div class="user-details">

        <span class="user-name">
          Rahma 2 Updated
        </span>

        <span class="user-id">
          #6aa5e5
        </span>

      </div>


      <i class="bi bi-shield-check verified-icon"></i>

    </div>

  </div>


  <div class="mt-auto px-3 py-3">

    <nav class="nav flex-column gap-1" role="navigation">

      <button
        (click)="logout()"
        type="button"
        style="background: transparent; border: none; text-align: left; width: 100%; cursor: pointer;"
        class="nav-link-custom d-flex align-items-center gap-2 px-2 py-2 rounded text-danger"
      >

        <i
          class="bi bi-box-arrow-left"
          aria-hidden="true"
        ></i>

        <span>Logout</span>

      </button>

    </nav>

  </div>

</aside>
