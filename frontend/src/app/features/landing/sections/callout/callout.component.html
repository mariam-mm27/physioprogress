<section class="callout-section">
  <div class="callout-card">
    <div class="callout-content">
      <div class="badge-pill">
        <span class="material-symbols-outlined badge-icon">bolt</span>
        <span class="badge-text">Zero Setup Friction</span>
      </div>

      <h2 class="callout-title">Ready to accelerate recovery?</h2>

      <p class="callout-subtitle">
        Join clinicians and patients achieving 92% adherence rates and shorter rehabilitation cycles.
      </p>

      <a class="btn-callout" routerLink="/auth" [queryParams]="{ mode: 'register' }">
        <span>Sign In / Register Now</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>

      <small class="callout-subtext">No credit card required for patient trial protocols • Instant DPT access</small>
    </div>
  </div>
</section>
