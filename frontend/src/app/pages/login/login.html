<div class="login-shell">
  <div class="login-card animate-slide-in-up">
    <div class="login-brand">
      <span class="brand-mark"><i class="bi bi-activity"></i></span>
      <h1 class="login-title">PhysioProgress</h1>
      <p class="login-subtitle">Therapist &amp; patient recovery platform</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input
            class="form-control"
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
            class="form-control"
            id="password"
            type="password"
            formControlName="password"
            placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
            autocomplete="current-password"
          />
        </div>
      </div>

      @if (error) {
        <div class="alert alert-danger py-2" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        </div>
      }

      <button class="btn btn-primary w-100 mt-2" type="submit" [disabled]="form.invalid || loading">
        @if (loading) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="login-foot">
      Sign in as a <code>therapist</code> or a <code>patient</code> to load the matching workspace.
    </p>
  </div>
</div>
